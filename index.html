    <script type="text/babel">
      // Destructure hooks from React
      const { useState, useEffect, useRef } = React;
      
      const allowedStocks = ["NFLX", "GOOG", "APH", "COST"];

      // Helper to check if market is open (Eastern Time)
      function checkMarketOpen() {
        const now = new Date();
        const utcHours = now.getUTCHours();
        const day = now.getUTCDay();
        const estHours = utcHours - 4; // Convert UTC to EST (consider DST)
        
        // Weekend check
        if (day === 0 || day === 6) return "closed";
        
        // Market hours: 9:30 AM to 4:00 PM ET
        const isMarketHours = (
          (estHours > 9 || (estHours === 9 && now.getUTCMinutes() >= 30)) && 
          (estHours < 16)
        );
        
        return isMarketHours ? "open" : "closed";
      }

      // Helper to format dates without timezone issues
      function formatDateSafe(dateStr) {
        if (!dateStr) return "N/A";
        const date = new Date(dateStr);
        // Handle timezone offset to get correct date
        const offset = date.getTimezoneOffset() * 60000;
        const localDate = new Date(date.getTime() - offset);
        return localDate.toISOString().split('T')[0];
      }

      // NavBar Component
      function NavBar({ setPage }) {
        return (
          <div className="navbar">
            <div className="logo">Wolfgang's Portfolio</div>
            <div className="nav-links">
              <button onClick={() => setPage("home")}>Home</button>
              <button onClick={() => setPage("news")}>News</button>
              <button onClick={() => setPage("stocks")}>Stocks</button>
              <button onClick={() => setPage("settings")}>Settings</button>
            </div>
          </div>
        );
      }

      // TickerBanner Component
      function TickerBanner() {
        const [tickerData, setTickerData] = useState([]);
        useEffect(() => {
          function fetchTicker() {
            const fallback = allowedStocks.map(sym => ({
              symbol: sym,
              price: (Math.random() * 1000 + 100).toFixed(2)
            }));
            setTickerData(fallback);
          }
          fetchTicker();
          const interval = setInterval(fetchTicker, 10000);
          return () => clearInterval(interval);
        }, []);
        const tickerText = tickerData.map(d => `${d.symbol}: $${d.price}`).join("   •••   ");
        return (
          <div className="ticker-banner">
            <div className="ticker-content">{tickerText || "Loading ticker..."}</div>
          </div>
        );
      }

      // PortfolioSummary Component
      function PortfolioSummary() {
        const [portfolio, setPortfolio] = useState([]);
        const [loading, setLoading] = useState(true);
        const [marketStatus, setMarketStatus] = useState("unknown");
        const [asOfDate, setAsOfDate] = useState(null);
        
        useEffect(() => {
        fetch(`http://localhost:5050/api/quote/APH`, { cache: 'no-store' }) // Fetch data with cache-busting
            .then(res => res.json()) // Parse JSON response
            .then(data => {
                console.log('Fetched Data:', data); // Log the full response for debugging
                setPortfolio(data.history || []); // Ensure the portfolio state is updated
            })
            .catch(error => console.error('Fetch error:', error)); // Log any fetch errors
    }, []);

        useEffect(() => {
          async function fetchPortfolio() {
            setLoading(true);
            const currentMarketStatus = checkMarketOpen();
            setMarketStatus(currentMarketStatus);
            
            const results = [];
            let latestPortfolioDate = null;
            
            for (const symbol of allowedStocks) {
              try {
                const response = await fetch(`http://localhost:5050/api/quote/${symbol}`);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                const history = data.history || [];
                
                // Find the most recent trading day
                let latestData = history[history.length - 1];
                let previousData = history.length >= 2 ? history[history.length - 2] : null;
                
                if (latestData && latestData.date) {
                  const stockDate = new Date(latestData.date);
                  if (!latestPortfolioDate || stockDate > latestPortfolioDate) {
                    latestPortfolioDate = stockDate;
                  }
                }

                // Determine what to display
                let displayPrice, displayDate, changeDisplay, isPositive;
                
                if (currentMarketStatus === "open" && data.currentPrice) {
                  displayPrice = data.currentPrice;
                  displayDate = formatDateSafe(new Date());
                  
                  if (latestData) {
                    const change = displayPrice - latestData.price;
                    const changePercent = (change / latestData.price * 100).toFixed(2);
                    changeDisplay = `${changePercent}%`;
                    isPositive = change >= 0;
                  }
                } else {
                  if (latestData) {
                    displayPrice = latestData.price;
                    displayDate = formatDateSafe(latestData.date);
                    
                    if (previousData) {
                      const change = displayPrice - previousData.price;
                      const changePercent = (change / previousData.price * 100).toFixed(2);
                      changeDisplay = `${changePercent}%`;
                      isPositive = change >= 0;
                    }
                  }
                }
                
                results.push({
                  symbol,
                  price: displayPrice ? displayPrice.toFixed(2) : "N/A",
                  change: changeDisplay || "N/A",
                  isPositive,
                  date: displayDate || "N/A"
                });
              } catch (err) {
                console.error(`Error fetching ${symbol}:`, err);
                results.push({
                  symbol,
                  price: "N/A",
                  change: "Error",
                  isPositive: false,
                  date: "N/A"
                });
              }
            }
            
            setPortfolio(results);
            setAsOfDate(latestPortfolioDate ? formatDateSafe(latestPortfolioDate) : null);
            setLoading(false);
          }

          fetchPortfolio();
          const interval = setInterval(fetchPortfolio, 30000);
          return () => clearInterval(interval);
        }, []);

        return (
          <div className="portfolio-summary">
            <h3>Portfolio Summary</h3>
            {loading ? (
              <div className="spinner"></div>
            ) : (
              <>
                <div style={{ marginBottom: '10px', fontSize: '0.9rem' }}>
                  Market: <span className={`market-status ${marketStatus}`}>
                    {marketStatus === 'open' ? 'Open' : 'Closed'}
                  </span>
                  {asOfDate && marketStatus === 'closed' && 
                    <span style={{ marginLeft: '10px' }}>
                      (Data as of {new Date(asOfDate).toLocaleDateString('en-US', { 
                        weekday: 'short', 
                        month: 'short', 
                        day: 'numeric' 
                      })})
                    </span>
                  }
                </div>
                
                {portfolio.map((item, idx) => (
                  <div key={idx} className="portfolio-card">
                    <h4>{item.symbol}</h4>
                    <p>Price: ${item.price}</p>
                    <p className={
                      item.change === "N/A" || item.change === "Error" ? 
                        'no-change' : 
                        item.isPositive ? 'positive' : 'negative'
                    }>
                      Daily Change: {item.change}
                    </p>
                    <p style={{ fontSize: '0.8rem', color: '#666' }}>
                      {item.date && item.date !== 'N/A' ? 
                        `Date: ${new Date(item.date).toLocaleDateString()}` : 
                        'Date not available'}
                    </p>
                  </div>
                ))}
              </>
            )}
          </div>
        );
      }

      // StockChart Component
      function StockChart({ symbol, timeframe }) {
        const canvasRef = useRef(null);
        const [chartData, setChartData] = useState(null);
        const [loading, setLoading] = useState(true);
        const chartRef = useRef(null);
        
        useEffect(() => {
          async function fetchChartData() {
            setLoading(true);
            try {
              const response = await fetch(`http://localhost:5050/api/quote/${symbol}`);
              if (!response.ok) throw new Error("Network error");
              const data = await response.json();
              
              if (!data.history || data.history.length === 0) {
                throw new Error("No history data");
              }

              let allData = data.history.map(item => ({
                date: new Date(item.date),
                price: item.price
              })).sort((a, b) => a.date - b.date);

              let filteredData = [...allData];
              if (timeframe !== "ALL") {
                const latestDate = allData[allData.length - 1].date;
                let cutoffDate = new Date(latestDate);
                
                switch(timeframe) {
                  case "5D":
                    let tradingDays = 0;
                    let daysBack = 0;
                    while (tradingDays < 5 && daysBack < 14) {
                      daysBack++;
                      const date = new Date(latestDate);
                      date.setDate(date.getDate() - daysBack);
                      if (date.getDay() !== 0 && date.getDay() !== 6) {
                        tradingDays++;
                      }
                    }
                    cutoffDate = new Date(latestDate);
                    cutoffDate.setDate(cutoffDate.getDate() - daysBack);
                    break;
                  case "1M":
                    cutoffDate.setMonth(cutoffDate.getMonth() - 1);
                    break;
                  case "3M":
                    cutoffDate.setMonth(cutoffDate.getMonth() - 3);
                    break;
                  case "6M":
                    cutoffDate.setMonth(cutoffDate.getMonth() - 6);
                    break;
                  case "YTD":
                    cutoffDate = new Date(latestDate.getFullYear(), 0, 1);
                    break;
                  default:
                    cutoffDate = new Date(0);
                }
                
                filteredData = allData.filter(item => item.date >= cutoffDate);
              }

              const marketOpen = checkMarketOpen();
              if (marketOpen === "open" && data.currentPrice) {
                const todayStr = formatDateSafe(new Date());
                if (!filteredData.some(item => formatDateSafe(item.date) === todayStr)) {
                  filteredData.push({
                    date: new Date(),
                    price: data.currentPrice
                  });
                }
              }

              filteredData.sort((a, b) => a.date - b.date);
              
              const labels = filteredData.map(item => {
                const date = new Date(item.date);
                if (timeframe === "ALL") {
                  return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                  });
                } else if (timeframe === "YTD" || timeframe === "6M" || timeframe === "3M") {
                  return date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric' 
                  });
                } else {
                  return date.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    month: 'short', 
                    day: 'numeric' 
                  });
                }
              });
              
              const prices = filteredData.map(item => item.price);

              setChartData({ labels, prices, allData: filteredData });
              setLoading(false);
            } catch (err) {
              console.error(err);
              setLoading(false);
            }
          }

          fetchChartData();
        }, [symbol, timeframe]);

        useEffect(() => {
          if (!chartData || loading) return;
          
          const ctx = canvasRef.current.getContext("2d");
          if (chartRef.current) {
            chartRef.current.destroy();
          }
          
          const config = {
            type: "line",
            data: {
              labels: chartData.labels,
              datasets: [{
                label: `${symbol} Price`,
                data: chartData.prices,
                borderColor: getComputedStyle(document.documentElement)
                  .getPropertyValue("--button-primary")
                  .trim(),
                backgroundColor: "rgba(0,51,102,0.1)",
                fill: true,
                tension: 0.1,
                pointRadius: timeframe === "ALL" ? 0 : 2,
                pointHoverRadius: 5,
                pointHitRadius: 10
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  display: false
                },
                tooltip: {
                  enabled: true,
                  callbacks: {
                    title: function(context) {
                      const date = new Date(chartData.allData[context[0].dataIndex].date);
                      return date.toLocaleDateString('en-US', { 
                        weekday: 'long', 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                      });
                    },
                    label: function(context) {
                      return `${symbol}: $${context.parsed.y.toFixed(2)}`;
                    }
                  }
                }
              },
              scales: {
                x: {
                  grid: {
                    display: false
                  },
                  ticks: {
                    maxRotation: timeframe === "ALL" ? 45 : 0,
                    autoSkip: true,
                    maxTicksLimit: timeframe === "ALL" ? 12 : 8
                  }
                },
                y: {
                  grid: {
                    color: "rgba(0,0,0,0.1)"
                  }
                }
              }
            }
          };
          
          chartRef.current = new Chart(ctx, config);
          
          return () => {
            if (chartRef.current) {
              chartRef.current.destroy();
            }
          };
        }, [chartData, loading, symbol, timeframe]);

        return (
          <div className="chart-container">
            {loading ? (
              <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100%' }}>
                <div className="spinner"></div>
              </div>
            ) : (
              <canvas ref={canvasRef} />
            )}
          </div>
        );
      }

        let cutoff = new Date(allHistories[0].slice(-1)[0]?.date || now);
        switch(tf) {
          case "5D": {
            let days = 0, back = 0;
            while(days < 5 && back < 14) {

              d.setDate(d.getDate() - back);
              if(d.getDay()!==0 && d.getDay()!==6) days++;
            }
            cutoff.setDate(cutoff.getDate() - back);
            break;
          }
          case "1M":
            cutoff.setMonth(cutoff.getMonth() - 1); break;
          case "3M":
            cutoff.setMonth(cutoff.getMonth() - 3); break;
          case "6M":
            cutoff.setMonth(cutoff.getMonth() - 6); break;
          case "YTD":
            cutoff = new Date(cutoff.getFullYear(), 0, 1); break;
          case "1Y":
            cutoff.setFullYear(cutoff.getFullYear() - 1); break;
          case "ALL":
            cutoff = new Date(0); break;
        }

        // compute each stock's growth over [cutoff → latest]
        const growths = allHistories
          .map(hist => {
            const slice = hist.filter(pt => pt.date >= cutoff);
            if(slice.length < 2) return null;
            const start = slice[0].price;
            const end   = slice[slice.length - 1].price;
            return (end - start) / start * 100;
          })
          .filter(v => v !== null);

        // average & round
        const avg = growths.length
          ? (growths.reduce((sum,v)=>sum+v,0)/growths.length).toFixed(2)
          : "N/A";

        results[tf] = avg;
      });

      setAverages(results);
    }

    computeAverages();
  }, []);

  return (
    <div style={{ marginTop: 20 }}>
      <h3>Average Growth Across All Stocks</h3>
      <table>
        <thead>
          <tr>
            <th>Timeframe</th>
            <th>Avg Growth %</th>
          </tr>
        </thead>
        <tbody>
          {timeframes.map(tf => (
            <tr key={tf}>
              <td>{tf}</td>
              <td>
                {averages[tf] != null ? averages[tf] + "%" : "…"}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

      // Stocks Component
      function Stocks() {
        const [stocks, setStocks] = useState([]);
        const [loading, setLoading] = useState(true);
        
        useEffect(() => {
          async function fetchStocks() {
            setLoading(true);
            try {
              const results = await Promise.all(
                allowedStocks.map(async sym => {
                  try {
                    const res = await fetch(`http://localhost:5050/api/quote/${sym}`);
                    if (!res.ok) throw new Error("Network error");
                    const data = await res.json();
                    return {
                      symbol: sym,
                      price: data.currentPrice?.toFixed(2) || "N/A",
                      change: data.changePercent !== "N/A" ? `${data.changePercent}%` : "N/A",
                      isPositive: data.changePercent !== "N/A" ? parseFloat(data.changePercent) > 0 : false
                    };
                  } catch (err) {
                    console.error(`Error fetching ${sym}:`, err);
                    return {
                      symbol: sym,
                      price: "N/A",
                      change: "Error",
                      isPositive: false
                    };
                  }
                })
              );
              setStocks(results);
            } catch (err) {
              console.error("Error fetching stocks:", err);
            } finally {
              setLoading(false);
            }
          }
          
          fetchStocks();
          const interval = setInterval(fetchStocks, 30000);
          return () => clearInterval(interval);
        }, []);
        
        return (
          <div className="container">
            <h2>Stock Details</h2>
            {loading ? (
              <div style={{ display: 'flex', justifyContent: 'center' }}>
                <div className="spinner"></div>
              </div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>Change</th>
                  </tr>
                </thead>
                <tbody>
                  {stocks.map((s, index) => (
                    <tr key={index}>
                      <td>{s.symbol}</td>
                      <td>${s.price}</td>
                      <td className={s.change.includes("Error") || s.change.includes("N/A") ? 
                          'no-change' : 
                          s.isPositive ? 'positive' : 'negative'}>
                        {s.change}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        );
      }
